name: Build IDU app
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build app
        run: |
          SPEC=$(find . -name project.yml -not -path "./.git/*" | head -1)
          if [ -z "$SPEC" ]; then echo "project.yml is missing - upload it to the repository"; exit 1; fi
          cd "$(dirname "$SPEC")"
          xcodegen generate
          xcodebuild -project IDU.xcodeproj -target IDU -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          cp -R build/Release-iphoneos/IDU.app "$GITHUB_WORKSPACE/Payload/"
          cd "$GITHUB_WORKSPACE" && zip -qr IDU.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IDU-app
          path: IDU.ipa
